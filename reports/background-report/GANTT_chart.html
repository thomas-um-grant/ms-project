<!DOCTYPE html>
<html>
  <head>
    <title>Project Timeline - Gantt Chart</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['gantt']});
      google.charts.setOnLoadCallback(drawChart);

      function daysToMilliseconds(days) {
        return days * 24 * 60 * 60 * 1000;
      }

      function drawChart() {
        var data = new google.visualization.DataTable();
        data.addColumn('string', 'Task ID');
        data.addColumn('string', 'Task Name');
        data.addColumn('string', 'Resource');
        data.addColumn('date', 'Start Date');
        data.addColumn('date', 'End Date');
        data.addColumn('number', 'Duration');
        data.addColumn('number', 'Percent Complete');
        data.addColumn('string', 'Dependencies');

        data.addRows([
          ['Task1', 'Dataset Generation Vanilla pipeline', 'Phase 1',
            new Date(2025, 5, 1), new Date(2025, 5, 14), null, 0, null],
          ['Task2', 'Evaluation Setup ViDoRe', 'Phase 1',
            new Date(2025, 5, 1), new Date(2025, 5, 14), null, 0, null],
          ['Task3', 'Improve Dataset Generation pipeline', 'Phase 1',
            new Date(2025, 5, 14), new Date(2025, 5, 20), null, 0, 'Task1'],
          ['Task4', 'Annotate Dataset', 'Phase 1',
            new Date(2025, 5, 14), new Date(2025, 5, 20), null, 0, 'Task3'],
          ['Task5', 'Final Dataset Measured by side\nwith ViDoRe benchmark on ColPali', 'Phase 1',
            new Date(2025, 5, 20), new Date(2025, 5, 25), null, 0, 'Task2'],

          ['Task6', 'Traditional RAG pipeline setup', 'Phase 2',
            new Date(2025, 5, 25), new Date(2025, 6, 5), null, 0, null],
          ['Task7', 'Add Graph RAG to pipeline', 'Phase 2',
            new Date(2025, 6, 5), new Date(2025, 6, 15), null, 0, 'Task6'],
          ['Task8', 'Add Multimodal RAG to pipeline', 'Phase 2',
            new Date(2025, 6, 5), new Date(2025, 6, 15), null, 0, 'Task6'],
          ['Task9', 'Add Evaluation setup', 'Phase 2',
            new Date(2025, 6, 15), new Date(2025, 6, 20), null, 0, null],
          ['Task10', 'Test Modular RAG pipeline on Evaluation setup', 'Phase 2',
            new Date(2025, 6, 20), new Date(2025, 6, 25), null, 0, 'Task9'],

          ['Task11', 'Experiments on gaps', 'Phase 3',
            new Date(2025, 6, 25), new Date(2025, 7, 10), null, 0, 'Task10'],
          ['Task12', 'Do an ablation study', 'Phase 3',
            new Date(2025, 6, 25), new Date(2025, 7, 10), null, 0, 'Task10'],

          ['Task13', 'Cleanup repo', 'Phase 4',
            new Date(2025, 7, 10), new Date(2025, 7, 12), null, 0, null],
          ['Task14', 'Add demo UI', 'Phase 4',
            new Date(2025, 7, 12), new Date(2025, 7, 20), null, 0, 'Task13'],

          ['Task15', 'Write Final Report', 'Phase 5',
            new Date(2025, 7, 20), new Date(2025, 8, 10), null, 0, null]
        ]);

        var options = {
          height: 800,
          gantt: {
            trackHeight: 30
          }
        };

        var chart = new google.visualization.Gantt(document.getElementById('chart_div'));

        chart.draw(data, options);
      }
    </script>
  </head>
  <body>
    <h2>Project Timeline - Gantt Chart</h2>
    <div id="chart_div"></div>
  </body>
</html>
